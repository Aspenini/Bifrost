[package]
name = "bifrost-host-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
bifrost-host.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "deny"
