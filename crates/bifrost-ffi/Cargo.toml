[package]
name = "bifrost-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bifrost-runtime = { workspace = true, features = ["guest-x86_64", "guest-aarch64", "interp"] }

[features]
default = ["executable-images"]
executable-images = ["bifrost-runtime/linux-elf", "bifrost-runtime/windows-pe"]

[lints.rust]
unsafe_code = "deny"
