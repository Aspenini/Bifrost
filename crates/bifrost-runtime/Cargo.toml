[package]
name = "bifrost-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
linux-elf = ["loader-elf", "os-linux", "guest-x86_64", "interp"]
windows-pe = ["loader-pe", "os-windows", "guest-x86_64", "interp"]
abi-bridge = ["dep:bifrost-abi", "dep:bifrost-bridge"]
guest-x86_64 = ["dep:bifrost-decoder-x86", "dep:bifrost-lifter-x86"]
guest-aarch64 = ["dep:bifrost-decoder-arm64", "dep:bifrost-lifter-arm64"]
interp = ["dep:bifrost-interpreter", "dep:bifrost-executor"]
jit-cranelift = ["dep:bifrost-codegen-clif", "dep:bifrost-codegen", "dep:bifrost-executor", "dep:bifrost-host", "dep:bifrost-host-linux", "dep:bifrost-host-windows"]
loader-elf = ["dep:bifrost-loader-elf", "dep:bifrost-loader"]
loader-pe = ["dep:bifrost-loader-pe", "dep:bifrost-loader"]
macho-inspect = ["dep:bifrost-loader-macho"]
os-linux = ["dep:bifrost-os-linux"]
os-windows = ["dep:bifrost-os-windows"]
host-windows = ["dep:bifrost-host-windows"]
host-linux = ["dep:bifrost-host-linux"]
host-macos = ["dep:bifrost-host-macos"]

[dependencies]
bifrost-core.workspace = true
bifrost-abi = { workspace = true, optional = true }
bifrost-bridge = { workspace = true, optional = true }
bifrost-ir.workspace = true
bifrost-memory.workspace = true
bifrost-decoder-x86 = { workspace = true, optional = true }
bifrost-lifter-x86 = { workspace = true, optional = true }
bifrost-decoder-arm64 = { workspace = true, optional = true }
bifrost-lifter-arm64 = { workspace = true, optional = true }
bifrost-interpreter = { workspace = true, optional = true }
bifrost-executor = { workspace = true, optional = true }
bifrost-codegen-clif = { workspace = true, optional = true }
bifrost-codegen = { workspace = true, optional = true }
bifrost-host = { workspace = true, optional = true }
bifrost-loader-elf = { workspace = true, optional = true }
bifrost-loader = { workspace = true, optional = true }
bifrost-loader-pe = { workspace = true, optional = true }
bifrost-loader-macho = { workspace = true, optional = true }
bifrost-os-linux = { workspace = true, optional = true }
bifrost-os-windows = { workspace = true, optional = true }
bifrost-host-windows = { workspace = true, optional = true }
bifrost-host-linux = { workspace = true, optional = true }
bifrost-host-macos = { workspace = true, optional = true }

[dev-dependencies]
bifrost-testkit.workspace = true

[lints]
workspace = true
