name: SDK packages

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Build release SDK
        run: cargo build --locked --release --target ${{ matrix.target }} -p bifrost-cli -p bifrost-ffi
      - name: Run guest fixtures
        run: cargo test --locked --release --target ${{ matrix.target }} -p bifrost-cli
      - name: Archive SDK
        run: python scripts/package-sdk.py ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release
      - name: Extract SDK for smoke tests
        run: python -m tarfile -e target/sdk/bifrost-${{ matrix.target }}.tar.gz target/sdk/smoke
      - name: Test extracted SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: target/sdk/smoke
        run: |
          ./bin/bifrost.exe inspect example/hello.elf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang --target=${{ matrix.target }} -Wall -Wextra -Werror -I include example/main.c lib/bifrost_ffi.dll.lib -o bin/c-embed.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/c-embed.exe example/hello.elf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang --target=${{ matrix.target }} -Wall -Wextra -Werror -I include example/raw.c lib/bifrost_ffi.dll.lib -o bin/c-embed-raw.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/c-embed-raw.exe
      - name: Test extracted SDK (Unix)
        if: runner.os != 'Windows'
        working-directory: target/sdk/smoke
        run: |
          ./bin/bifrost inspect example/hello.elf
          cc -Wall -Wextra -Werror -I include example/main.c -L lib -lbifrost_ffi -Wl,-rpath,"$PWD/lib" -o example/c-embed
          ./example/c-embed example/hello.elf
          cc -Wall -Wextra -Werror -I include example/raw.c -L lib -lbifrost_ffi -Wl,-rpath,"$PWD/lib" -o example/c-embed-raw
          ./example/c-embed-raw
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-${{ matrix.target }}
          path: target/sdk/bifrost-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release-bundle:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bifrost-*
          merge-multiple: true
          path: target/sdk
      - name: Require and hash all SDK archives
        run: python scripts/package-sdk.py --checksums
      - name: Verify release checksums
        working-directory: target/sdk
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-sdk-release
          path: |
            target/sdk/bifrost-*.tar.gz
            target/sdk/SHA256SUMS
          if-no-files-found: error
