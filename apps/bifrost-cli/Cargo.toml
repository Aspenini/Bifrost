[package]
name = "bifrost-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
bifrost-runtime = { workspace = true, features = ["linux-elf", "windows-pe"] }

[features]
default = ["jit"]
jit = ["bifrost-runtime/jit-cranelift"]

[lints]
workspace = true
